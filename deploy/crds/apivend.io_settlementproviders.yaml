---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: settlementproviders.apivend.io
spec:
  group: apivend.io
  names:
    kind: SettlementProvider
    listKind: SettlementProviderList
    plural: settlementproviders
    shortNames:
    - settleprov
    singular: settlementprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SettlementProvider says how committed payments are settled. It is
          cluster-scoped; the Secrets it references live in the controller's
          namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              backends:
                description: Backends are tried in priority order (lowest first).
                items:
                  properties:
                    auth:
                      description: |-
                        Auth is how the credentials are sent: bearer (default) as a static
                        token, or cdp as a fresh JWT per request signed with the CDP API key
                        (Coinbase's facilitator, https://api.cdp.coinbase.com/platform/v2/x402).
                      enum:
                      - bearer
                      - cdp
                      type: string
                    credentialsRef:
                      description: |-
                        CredentialsRef names a Secret in the controller's namespace holding the
                        facilitator credentials: a bearer token, or with auth cdp the Coinbase
                        Developer Platform Secret API key file ({"id": ..., "privateKey": ...}).
                        For direct: the gas key, 32 bytes of hex. It pays gas only; fund it
                        with a little ETH on each network.
                      properties:
                        key:
                          description: Key within the Secret. Default "token".
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    maxFee:
                      description: |-
                        MaxFee (direct) is the most one settlement may spend on gas, in ETH.
                        Default "0.00002", about 20 times a Base settlement at 0.01 gwei.
                      pattern: ^[0-9]*\.?[0-9]+$
                      type: string
                    priority:
                      format: int32
                      type: integer
                    rpcRef:
                      description: RPCRef and SignerRef are reserved.
                      properties:
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    signerRef:
                      properties:
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    type:
                      description: |-
                        Type is facilitator (an x402 facilitator settles) or direct (the
                        settler submits USDC transferWithAuthorization itself through its own
                        -rpc endpoints, gas paid by the key in credentialsRef; no compliance
                        screening).
                      enum:
                      - facilitator
                      - direct
                      type: string
                    url:
                      description: URL of the facilitator, without the /settle suffix.
                      type: string
                  required:
                  - type
                  type: object
                minItems: 1
                type: array
            required:
            - backends
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
