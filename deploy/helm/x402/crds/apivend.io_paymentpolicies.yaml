---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: paymentpolicies.apivend.io
spec:
  group: apivend.io
  names:
    kind: PaymentPolicy
    listKind: PaymentPolicyList
    plural: paymentpolicies
    shortNames:
    - paypol
    singular: paymentpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .spec.price.amount
      name: Price
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PaymentPolicy puts an x402 price on an HTTPRoute in the same namespace.
          Deleting the policy makes the route free again.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              accepts:
                description: Accepts lists the networks and assets the price can be
                  paid in.
                items:
                  properties:
                    asset:
                      description: Asset symbol, e.g. "USDC".
                      type: string
                    network:
                      description: Network, e.g. "base" or "base-sepolia".
                      type: string
                    payTo:
                      description: PayTo is the address that receives payments.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    schemes:
                      description: |-
                        Schemes offered: exact (default: one transfer per request) and/or
                        batch-settlement (payment channels: a deposit, then signed vouchers,
                        claimed in batches). batch-settlement needs the controller's
                        -batch-receiver-authorizer.
                      items:
                        enum:
                        - exact
                        - batch-settlement
                        type: string
                      maxItems: 2
                      type: array
                  required:
                  - asset
                  - network
                  - payTo
                  type: object
                minItems: 1
                type: array
              description:
                description: Description is shown to clients in the 402 challenge.
                maxLength: 256
                type: string
              discovery:
                description: |-
                  Discovery describes the route for x402 catalogues (the bazaar
                  extension) and for the gateway's own catalogue. Nothing is published
                  until Enabled is true.
                properties:
                  body:
                    description: Body is an example request body (POST, PUT, PATCH).
                    x-kubernetes-preserve-unknown-fields: true
                  bodyType:
                    description: BodyType of a POST, PUT or PATCH request. Default
                      json.
                    enum:
                    - json
                    - form-data
                    - text
                    type: string
                  enabled:
                    description: |-
                      Enabled puts the bazaar extension in the route's 402 and on the
                      payments it settles. Facilitators that index resources list the route
                      from it: CDP's Bazaar lists it after the first settled payment, with no
                      review. Default false: the metadata is kept but not published.
                    type: boolean
                  iconUrl:
                    description: |-
                      IconURL is a PNG, JPEG, WebP or GIF image over HTTPS (catalogues do
                      not accept SVG).
                    pattern: ^https://
                    type: string
                  method:
                    description: Method of the request. Default GET.
                    enum:
                    - GET
                    - HEAD
                    - DELETE
                    - POST
                    - PUT
                    - PATCH
                    type: string
                  output:
                    description: Output describes the response.
                    properties:
                      example:
                        description: Example response.
                        x-kubernetes-preserve-unknown-fields: true
                      type:
                        description: Type of the response, e.g. json. Default json.
                        maxLength: 32
                        type: string
                    type: object
                  queryParams:
                    description: QueryParams the route takes, each with an example
                      value.
                    items:
                      properties:
                        description:
                          maxLength: 200
                          type: string
                        example:
                          description: Example is shown to clients as the value to
                            send.
                          maxLength: 256
                          type: string
                        name:
                          maxLength: 64
                          minLength: 1
                          type: string
                        required:
                          type: boolean
                      required:
                      - name
                      type: object
                    maxItems: 20
                    type: array
                  serviceName:
                    description: ServiceName is a short display name.
                    maxLength: 32
                    pattern: ^[ -~]*$
                    type: string
                  tags:
                    description: Tags help catalogues group the route.
                    items:
                      maxLength: 32
                      type: string
                    maxItems: 5
                    type: array
                type: object
              maxTimeoutSeconds:
                description: |-
                  MaxTimeoutSeconds is how long a client's payment authorization should
                  stay valid. Default 60.
                format: int32
                maximum: 3600
                minimum: 15
                type: integer
              price:
                description: Price of one request.
                properties:
                  amount:
                    description: Amount as a decimal string, e.g. "0.01".
                    pattern: ^[0-9]*\.?[0-9]+$
                    type: string
                  currency:
                    enum:
                    - USD
                    type: string
                required:
                - amount
                - currency
                type: object
              risk:
                properties:
                  freshness:
                    description: Freshness is the maximum age of a cached payer balance.
                      Default 5s.
                    type: string
                  onStateUnavailable:
                    description: |-
                      OnStateUnavailable decides what happens when payer state cannot be
                      reached: deny (default) refuses the request, allow serves it unpaid.
                    enum:
                    - deny
                    - allow
                    type: string
                  simulate:
                    description: Simulate is reserved; true is rejected for now.
                    type: boolean
                type: object
              settlement:
                properties:
                  maxUnsettledPerPayer:
                    description: |-
                      MaxUnsettledPerPayer caps, in the price currency, what one payer may
                      have in flight plus served-but-unsettled. It bounds the seller's loss
                      per payer in async mode. Default "1.00".
                    pattern: ^[0-9]*\.?[0-9]+$
                    type: string
                  mode:
                    description: |-
                      Mode is async (respond, then settle; the default) or sync (hold the
                      response until the payment has settled, up to 10s).
                    enum:
                    - async
                    - sync
                    type: string
                  providerRef:
                    description: ProviderRef names the SettlementProvider. Default
                      "default".
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              targetRef:
                description: |-
                  TargetRef names the HTTPRoute to price. It must be in the policy's
                  namespace.
                properties:
                  group:
                    enum:
                    - gateway.networking.k8s.io
                    type: string
                  kind:
                    enum:
                    - HTTPRoute
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - group
                - kind
                - name
                type: object
            required:
            - accepts
            - price
            - targetRef
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
