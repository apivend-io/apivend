# Standalone Envoy in front of one backend, with x402-filter as an external
# processor. For local runs and the end-to-end test; in a cluster the same
# filter settings are applied through the gateway (Envoy Gateway's
# EnvoyExtensionPolicy) rather than written by hand.
#
#   client -> :10000 (Envoy) -> 127.0.0.1:8080 (backend)
#                 \-> 127.0.0.1:9002 (x402-filter, gRPC)
static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        # Named as Envoy Gateway names the routes of an
                        # HTTPRoute, to exercise match.envoyRoutePrefix.
                        - name: httproute/demo/maps/rule/0/match/0
                          match: { prefix: "/maps" }
                          route: { cluster: backend }
                        - match: { prefix: "/" }
                          route: { cluster: backend }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: x402_filter }
                      # Fail closed: a priced route must never be served
                      # because the processor was down.
                      failure_mode_allow: false
                      # Headers both ways, nothing else. The request phase
                      # challenges and verifies; the response phase decides
                      # whether to charge.
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: NONE
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                      # The filter asks for a paid answer's body when it
                      # checks the answer before charging (-answer-check).
                      allow_mode_override: true
                      # Lets the price table match on the selected route's name.
                      request_attributes: ["xds.route_name"]
                      message_timeout: 0.2s
                      # Sync-settlement routes hold the response while the
                      # payment lands; the filter asks for more time on that
                      # one message, up to this limit.
                      max_message_timeout: 15s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: backend
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8080 }
    - name: x402_filter
      type: STATIC
      connect_timeout: 0.25s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: x402_filter
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9002 }
