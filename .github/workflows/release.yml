# A release: pushing a tag vX.Y.Z publishes the gateway image
# ghcr.io/apivend-io/gateway:X.Y.Z (linux/amd64 and linux/arm64) and the Helm
# chart oci://ghcr.io/apivend-io/charts/x402 at version X.Y.Z, whose default
# image is that tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # the GitHub release
  packages: write   # the image and the chart

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/apivend-io/gateway:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/apivend-io/apivend
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/x402 --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}" -d "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/x402-${{ steps.v.outputs.version }}.tgz" oci://ghcr.io/apivend-io/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
