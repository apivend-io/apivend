# A release: pushing a tag vX.Y.Z publishes the gateway image
# ghcr.io/apivend-io/gateway:X.Y.Z (linux/amd64 and linux/arm64) and the Helm
# chart oci://ghcr.io/apivend-io/charts/x402 at version X.Y.Z, whose default
# image is that tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # the GitHub release
  packages: write   # the image and the chart

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/apivend-io/gateway:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/apivend-io/apivend
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1
      - name: Chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/x402 --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}" -d "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/x402-${{ steps.v.outputs.version }}.tgz" oci://ghcr.io/apivend-io/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
