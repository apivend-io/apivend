# Test fixtures: an Envoy Gateway Gateway in "prod", a whoami backend and the
# HTTPRoutes the policies price ("search" at /, "search-sync" at /sync).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: eg }
spec: { controllerName: gateway.envoyproxy.io/gatewayclass-controller }
---
apiVersion: v1
kind: Namespace
metadata: { name: prod }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: public, namespace: prod }
spec:
  gatewayClassName: eg
  listeners: [{ name: http, protocol: HTTP, port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: search, namespace: prod }
spec:
  selector: { matchLabels: { app: search } }
  template:
    metadata: { labels: { app: search } }
    spec:
      containers: [{ name: whoami, image: traefik/whoami:v1.10.3, ports: [{ containerPort: 80 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: search, namespace: prod }
spec: { selector: { app: search }, ports: [{ port: 80 }] }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: search, namespace: prod }
spec:
  parentRefs: [{ name: public }]
  rules: [{ backendRefs: [{ name: search, port: 80 }] }]
---
# Same backend under /sync, priced with sync settlement by sync-policy.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: search-sync, namespace: prod }
spec:
  parentRefs: [{ name: public }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /sync } }]
      backendRefs: [{ name: search, port: 80 }]
